<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<style>
body{
    margin:0;
    overflow:hidden;
    background:black;
    font-family:sans-serif;
}

canvas{
    position:fixed;
    inset:0;
    display:block;
}

#ui{
    position:absolute;
    top:10px;
    left:10px;
    padding:10px;

    max-height:calc(100vh - 20px);

#ui > summary,

}

#ui[open] > summary{

}

#sceneEditor{

<script type="module">

import * as THREE from "three";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";
import {TransformControls} from "three/addons/controls/TransformControls.js";

const showImageFactors = false;

///////////////////////////////////////////////////////////////////////////
// renderer
///////////////////////////////////////////////////////////////////////////

const renderer = new THREE.WebGLRenderer({
    antialias:true,
    preserveDrawingBuffer:true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

document.body.appendChild(renderer.domElement);

function positionControlPanel(panel, left, top)
{
    const maxLeft = Math.max(0, window.innerWidth - panel.offsetWidth);
    const maxTop = Math.max(0, window.innerHeight - panel.offsetHeight);
    panel.style.left = `${Math.max(0, Math.min(left, maxLeft))}px`;
    panel.style.top = `${Math.max(0, Math.min(top, maxTop))}px`;
    panel.style.right = "auto";
}

document.querySelectorAll("#ui, #sceneEditor").forEach(panel =>
{
    const summary = panel.querySelector(":scope > summary");
    let press = null;

    summary.addEventListener("pointerdown", event =>
    {
        if(event.button !== 0)
        {
            return;
        }

        const bounds = panel.getBoundingClientRect();
        const nextPress = {
            pointerId: event.pointerId,
            startX: event.clientX,
            startY: event.clientY,
            offsetX: event.clientX - bounds.left,
            offsetY: event.clientY - bounds.top,
            dragReady: false,
            dragging: false,
            timer: null
        };
        press = nextPress;
        summary.setPointerCapture(event.pointerId);
        nextPress.timer = window.setTimeout(
            () =>
            {
                if(press === nextPress)
                {
                    nextPress.dragReady = true;
                }
            },
            250
        );
    });

    summary.addEventListener("pointermove", event =>
    {
        if(press?.pointerId !== event.pointerId)
        {
            return;
        }

        const distance = Math.hypot(
            event.clientX - press.startX,
            event.clientY - press.startY
        );
        if(!press.dragReady)
        {
            if(distance > 6)
            {
                window.clearTimeout(press.timer);
                press = null;
            }
            return;
        }

        if(distance <= 4)
        {
            return;
        }

        press.dragging = true;
        event.preventDefault();
        positionControlPanel(
            panel,
            event.clientX - press.offsetX,
            event.clientY - press.offsetY
        );
    });

    summary.addEventListener("pointerup", event =>
    {
        if(press?.pointerId !== event.pointerId)
        {
            return;
        }

        window.clearTimeout(press.timer);
        window.setTimeout(() => press = null, 0);
    });

    summary.addEventListener("pointercancel", event =>
    {
        if(press?.pointerId === event.pointerId)
        {
            window.clearTimeout(press.timer);
            press = null;
        }
    });

    summary.addEventListener("click", event =>
    {
        if(press?.dragging)
        {
            event.preventDefault();
        }
    });
});

const imageContextMenu =
    document.getElementById("imageContextMenu");
const imageContextStatus =
    document.getElementById("imageContextStatus");

function isImageContextTarget(target)
{
    return target === renderer.domElement;
}

function closeImageContextMenu()
{
    imageContextMenu.hidden = true;
}

function showImageContextMenu(clientX, clientY)
{
    imageContextStatus.textContent = "";
    imageContextMenu.hidden = false;
    imageContextMenu.style.left = `${clientX}px`;
    imageContextMenu.style.top = `${clientY}px`;

    const bounds = imageContextMenu.getBoundingClientRect();
    imageContextMenu.style.left =
        `${Math.max(8, Math.min(clientX, window.innerWidth - bounds.width - 8))}px`;
    imageContextMenu.style.top =
        `${Math.max(8, Math.min(clientY, window.innerHeight - bounds.height - 8))}px`;
}

function openImageContextMenu(event)
{
    if(!isImageContextTarget(event.target))
    {
        return;
    }

    event.preventDefault();
    showImageContextMenu(event.clientX, event.clientY);
}

document.addEventListener("contextmenu", openImageContextMenu);
let imageContextLongPress = null;
document.addEventListener(
    "pointerdown",
    event =>
    {
        if(event.pointerType !== "touch" ||
            !isImageContextTarget(event.target))
        {
            imageContextLongPress = null;
            return;
        }

        const longPress = {
            pointerId: event.pointerId,
            x: event.clientX,
            y: event.clientY
        };
        imageContextLongPress = longPress;
        window.setTimeout(
            () =>
            {
                if(imageContextLongPress !== longPress)
                {
                    return;
                }

                imageContextLongPress = null;
                showImageContextMenu(longPress.x, longPress.y);
            },
            500
        );
    }
);
document.addEventListener(
    "pointermove",
    event =>
    {
        if(imageContextLongPress?.pointerId === event.pointerId &&
            Math.hypot(
                event.clientX - imageContextLongPress.x,
                event.clientY - imageContextLongPress.y
            ) > 10)
        {
            imageContextLongPress = null;
        }
    }
);
for(const eventName of ["pointerup", "pointercancel"])
{
    document.addEventListener(
        eventName,
        event =>
        {
            if(imageContextLongPress?.pointerId === event.pointerId)
            {
                imageContextLongPress = null;
            }
        }
    );
}
document.addEventListener(
    "pointerdown",
    event =>
    {
        if(!imageContextMenu.hidden &&
            !imageContextMenu.contains(event.target))
        {
            closeImageContextMenu();
        }
    }
);
document.addEventListener(
    "keydown",
    event =>
    {
        if(event.key === "Escape")
        {
            closeImageContextMenu();
        }
    }
);

function getCurrentImageBlob()
{
    return new Promise((resolve, reject) =>
    {
        renderer.domElement.toBlob(
            blob =>
            {
                if(blob)
                {
                    resolve(blob);
                }
                else
                {
                    reject(new Error("The current image could not be captured."));
                }
            },
            "image/png"
        );
    });
}

document
    .getElementById("saveCurrentImage")
    .addEventListener(
        "click",
        async () =>
        {
            try
            {
                const blob = await getCurrentImageBlob();
                const url = URL.createObjectURL(blob);
                const download = document.createElement("a");
                download.href = url;
                download.download = "misfeedback.png";
                download.click();
                window.setTimeout(
                    () => URL.revokeObjectURL(url),
                    1000
                );
                imageContextStatus.textContent = "Image saved.";
            }
            catch(error)
            {
                imageContextStatus.textContent =
                    `Could not save image: ${error.message}`;
            }
        }
    );

document
    .getElementById("copyCurrentImage")
    .addEventListener(
        "click",
        async () =>
        {
            try
            {
                if(!navigator.clipboard?.write || !window.ClipboardItem)
                {
                    throw new Error(
                        "Image clipboard access is not available in this browser context."
                    );
                }

                const blob = await getCurrentImageBlob();
                await navigator.clipboard.write([
                    new ClipboardItem({"image/png": blob})
                ]);
                imageContextStatus.textContent = "Image copied to clipboard.";
            }
            catch(error)
            {
                imageContextStatus.textContent =
                    `Could not copy image: ${error.message}`;
            }
        }
    );

///////////////////////////////////////////////////////////////////////////
// scene
///////////////////////////////////////////////////////////////////////////

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101010);

scene.add(new THREE.AmbientLight(0xffffff, 0.4));

const lightingTarget = new THREE.Object3D();
lightingTarget.position.set(0, 0, 20);
scene.add(lightingTarget);

[
    {position: [-8, 10, -5], intensity: 2},
    {position: [8, 5, 32], intensity: 1.2},
    {position: [0, -8, 24], intensity: 0.8}
].forEach(({position, intensity}) =>
{
    const light = new THREE.DirectionalLight(0xffffff, intensity);
    light.position.set(...position);
    light.target = lightingTarget;
    scene.add(light);
});

// z coordinate of reference plane
const zA = 10;



///////////////////////////////////////////////////////////////////////////
// observer camera
///////////////////////////////////////////////////////////////////////////

const observerCamera =
    new THREE.PerspectiveCamera(
        50,
        window.innerWidth/window.innerHeight,
        0.1,
        100
    );

const initialObserverCameraPosition =
    new THREE.Vector3(12,7,-6);
observerCamera.position.copy(initialObserverCameraPosition);
observerCamera.lookAt(0,0,zA);

const controls =
    new OrbitControls(
        observerCamera,
        renderer.domElement
    );

controls.target.set(0,0,zA);
controls.update();

const transformControls =
    new TransformControls(
        observerCamera,
        renderer.domElement
    );
const transformControlsHelper =
    typeof transformControls.getHelper === "function"
        ? transformControls.getHelper()
        : transformControls;
const transformControlsScene = new THREE.Scene();
transformControlsScene.add(transformControlsHelper);

transformControls.addEventListener(
    "dragging-changed",
    event =>
    {
        controls.enabled = !event.value;
    }
);

///////////////////////////////////////////////////////////////////////////
// capture camera
///////////////////////////////////////////////////////////////////////////

const captureCamera =
    new THREE.PerspectiveCamera(
        50,
        window.innerWidth/window.innerHeight,
        0.1,
        100
    );

function updateAutostereogramFrame()

    captureCamera.updateMatrixWorld(true);

    const direction = new THREE.Vector3();
    const position =
        autostereogramFrameGeometry.getAttribute("position");

    for(let i = 0; i < 4; i++)
    {
        const x = i === 0 || i === 3 ? -1 : 1;
        const y = i < 2 ? -1 : 1;
        worldPoint.set(x, y, 0.5).unproject(captureCamera);
        direction.subVectors(worldPoint, origin);
        const distance = (zA - origin.z)/direction.z;
        position.setXYZ(
            i,
            origin.x + direction.x*distance,
            origin.y + direction.y*distance,
            zA - 0.01
        );
    }

    position.needsUpdate = true;
    autostereogramFrameGeometry.computeBoundingSphere();
}

function resizeCameraPreview(targetSize)
{
    const scale =
        Math.min(
            1,
            320/Math.max(
                targetSize.width,
                targetSize.height
            )
        );
    const width =
        Math.max(1, Math.round(targetSize.width*scale));
    const height =
        Math.max(1, Math.round(targetSize.height*scale));

    cameraPreviewTarget.setSize(width, height);
    cameraPreviewPixels = new Uint8Array(width*height*4);
    cameraPreviewImageData =
        cameraPreviewContext.createImageData(width, height);
}

function clearCameraPreview()
{
    cameraPreviewContext.fillStyle = "white";
    cameraPreviewContext.fillRect(
        0,
        0,
        cameraPreviewCanvas.width,
        cameraPreviewCanvas.height

function updateCameraPreview(cameraFrame)
{
    const previousRenderTarget = renderer.getRenderTarget();
    const width = cameraPreviewTarget.width;
    const height = cameraPreviewTarget.height;
    if(cameraPreviewCanvas.width !== width ||
        cameraPreviewCanvas.height !== height)
    {
        cameraPreviewCanvas.width = width;
        cameraPreviewCanvas.height = height;
        cameraPreviewImageData =
            cameraPreviewContext.createImageData(width, height);
    }

    try
    {
        cameraPreviewUniforms.image.value = cameraFrame;
        renderer.setRenderTarget(cameraPreviewTarget);
        renderer.clear();
        renderer.render(
            cameraPreviewScene,
            cameraPreviewRenderCamera
        );
        renderer.readRenderTargetPixels(
            cameraPreviewTarget,
            0,
            0,
            width,
            height,
            cameraPreviewPixels
        );

        const rowSize = width*4;
        for(let y = 0; y < height; y++)
        {
            const sourceOffset = (height - 1 - y)*rowSize;
            const destinationOffset = y*rowSize;
            cameraPreviewImageData.data.set(
                cameraPreviewPixels.subarray(
                    sourceOffset,
                    sourceOffset + rowSize
                ),
                destinationOffset
            );
        }
        cameraPreviewContext.putImageData(
            cameraPreviewImageData,
            0,
            0
        );
    }
    finally
    {
        renderer.setRenderTarget(previousRenderTarget);
    }
}

const projectorPlaneProjection =

const keystonePlaneZ = 10;

function updateCaptureCameraCoverage()
{
    captureCamera.updateProjectionMatrix();
    if(!keystoneAdjustmentToggle.checked)
    {
        return;
    }

    // Fit the projector's full reference-plane footprint into the capture view.
    captureCamera.updateMatrixWorld(true);
    projector.updateMatrixWorld(true);

    let minX = Infinity;
    let maxX = -Infinity;
    let minY = Infinity;
    let maxY = -Infinity;
    const corner = new THREE.Vector3();
    const direction = new THREE.Vector3();
    const planePoint = new THREE.Vector3();

    for(const x of [-1, 1])
    {
        for(const y of [-1, 1])
        {
            corner.set(x, y, 0.5).unproject(projector);
            direction.subVectors(corner, projector.position);
            const distance =
                (keystonePlaneZ - projector.position.z)/direction.z;
            planePoint.copy(projector.position)
                .addScaledVector(direction, distance)
                .project(captureCamera);

            minX = Math.min(minX, planePoint.x);
            maxX = Math.max(maxX, planePoint.x);
            minY = Math.min(minY, planePoint.y);
            maxY = Math.max(maxY, planePoint.y);
        }
    }

    const centerX = (minX + maxX)*0.5;
    const centerY = (minY + maxY)*0.5;
    const halfWidth = (maxX - minX)*0.5;
    const halfHeight = (maxY - minY)*0.5;
    const scale =
        0.98/Math.max(halfWidth, halfHeight);
    const offsetX = -centerX*scale;
    const offsetY = -centerY*scale;
    const elements = captureCamera.projectionMatrix.elements;

    elements[0] *= scale;
    elements[8] = elements[8]*scale - offsetX;
    elements[5] *= scale;
    elements[9] = elements[9]*scale - offsetY;
    captureCamera.projectionMatrixInverse
        .copy(captureCamera.projectionMatrix)
        .invert();
    captureCamera.updateMatrixWorld(true);
}

function updateCameraKeystoneTransform()
{
    if(!keystoneAdjustmentToggle.checked)
    {
        projectionUniforms.cameraKeystoneTransform.value.identity();
        return;
    }

    captureCamera.updateMatrixWorld(true);
    projector.updateMatrixWorld(true);
    cameraClipMatrix.multiplyMatrices(
        captureCamera.projectionMatrix,
        captureCamera.matrixWorldInverse
    );
    projectorClipMatrix.multiplyMatrices(
        projector.projectionMatrix,
        projector.matrixWorldInverse
    );

    const cameraElements = cameraClipMatrix.elements;
    cameraPlaneProjection.set(
        cameraElements[0],
        cameraElements[4],
        cameraElements[8]*keystonePlaneZ + cameraElements[12],
        cameraElements[1],
        cameraElements[5],
        cameraElements[9]*keystonePlaneZ + cameraElements[13],
        cameraElements[3],
        cameraElements[7],
        cameraElements[11]*keystonePlaneZ + cameraElements[15]
    );

    const projectorElements = projectorClipMatrix.elements;
    projectorPlaneProjection.set(
        projectorElements[0],
        projectorElements[4],
        projectorElements[8]*keystonePlaneZ + projectorElements[12],
        projectorElements[1],
        projectorElements[5],
        projectorElements[9]*keystonePlaneZ + projectorElements[13],
        projectorElements[3],
        projectorElements[7],
        projectorElements[11]*keystonePlaneZ + projectorElements[15]
    );

    projectorPlaneProjection.invert();
    projectionUniforms.cameraKeystoneTransform.value
        .copy(cameraPlaneProjection)
        .multiply(projectorPlaneProjection);
}

const projectionMaterial =
    new THREE.ShaderMaterial({
        uniforms: projectionUniforms,
        vertexShader:`
            varying vec2 vUv;

            void main()
            {
                vUv = uv;
                gl_Position = vec4(position, 1.0);
            }
        `,
        fragmentShader:`
            uniform sampler2D previousFrame;
            uniform sampler2D currentFrame;
            uniform mat3 currentFrameTransform;
            uniform float cameraImageLinear;
            uniform vec2 cameraFrameTexelSize;
            uniform mat3 cameraKeystoneTransform;
            uniform float textureMode;
            uniform float magnification;
            uniform float rotation;
            uniform float previousFactor;
            uniform float currentFactor;

            varying vec2 vUv;

            vec4 sampleCameraFrame(sampler2D image, vec2 uv)
            {
                if(cameraImageLinear < 0.5)
                {
                    vec2 nearestUv =
                        (floor(uv/cameraFrameTexelSize) + 0.5) *
                            cameraFrameTexelSize;
                    return texture2D(image, nearestUv);
                }

                vec2 texelPosition =
                    uv/cameraFrameTexelSize - 0.5;
                vec2 base = floor(texelPosition);
                vec2 fraction = fract(texelPosition);
                vec2 topLeft =
                    (base + 0.5)*cameraFrameTexelSize;
                vec4 top = mix(
                    texture2D(image, topLeft),
                    texture2D(
                        image,
                        topLeft + vec2(cameraFrameTexelSize.x, 0.0)
                    ),
                    fraction.x
                );
                vec4 bottom = mix(
                    texture2D(
                        image,
                        topLeft + vec2(0.0, cameraFrameTexelSize.y)
                    ),
                    texture2D(image, topLeft + cameraFrameTexelSize),
                    fraction.x
                );
                return mix(top, bottom, fraction.y);
            }

            void main()
            {
                vec3 projectorNdc =
                    vec3(vUv*2.0 - 1.0, 1.0);
                vec3 cameraNdc =
                    cameraKeystoneTransform * projectorNdc;
                vec2 cameraUv =
                    cameraNdc.xy/cameraNdc.z * 0.5 + 0.5;
                vec2 cameraCentered =
                    cameraUv - 0.5;
                vec2 projectorCentered =
                    vUv - 0.5;
                float cosine = cos(rotation);
                float sine = sin(rotation);
                vec2 rotatedCameraUv =
                    vec2(
                        cosine*cameraCentered.x -
                            sine*cameraCentered.y,
                        sine*cameraCentered.x +
                            cosine*cameraCentered.y
                    )/magnification + 0.5;
                vec2 rotatedProjectorUv =
                    vec2(
                        cosine*projectorCentered.x -
                            sine*projectorCentered.y,
                        sine*projectorCentered.x +
                            cosine*projectorCentered.y
                    )/magnification + 0.5;

                vec3 previous =
                    sampleCameraFrame(
                        previousFrame,
                        rotatedCameraUv
                    ).rgb;
                vec3 currentCoordinates =
                    textureMode > 0.5
                        ? currentFrameTransform *
                            vec3(rotatedProjectorUv, 1.0)
                        : vec3(rotatedCameraUv, 1.0);
                vec2 currentUv =
                    currentCoordinates.xy/currentCoordinates.z;
                vec3 current =
                    textureMode > 0.5
                        ? texture2D(currentFrame, currentUv).rgb
                        : sampleCameraFrame(
                            currentFrame,
                            currentUv
                        ).rgb;

                vec3 projected =
                    textureMode > 0.5
                        ? current
                        : previousFactor * previous +
                            currentFactor * current;
                gl_FragColor = vec4(projected, 1.0);
            }
        `
    });

const uniforms = {

        value : seedTexture
    },

    feedbackTexelSize : feedbackTexelSizeUniform,
    projectorVisibilityTex :

};

function createFeedbackMaterial(side = THREE.FrontSide)
{
    return new THREE.ShaderMaterial({

        uniforms,
        side,

        vertexShader:`

            varying vec3 vWorldPos;

            void main()
            {
                vec4 wp =
                    modelMatrix *
                    vec4(position,1.0);

                vWorldPos = wp.xyz;

                gl_Position =
                    projectionMatrix *
                    modelViewMatrix *
                    vec4(position,1.0);
            }
        `,

        fragmentShader:`

            uniform sampler2D feedbackTex;
            uniform sampler2D projectorVisibilityTex;
            uniform vec2 projectorVisibilityTexelSize;
            uniform float cameraImageLinear;
            uniform vec2 feedbackTexelSize;
            uniform mat4 projectorViewMatrix;
            uniform mat4 projectorProjectionMatrix;

            varying vec3 vWorldPos;

            vec4 sampleFeedback(vec2 uv)
            {
                if(cameraImageLinear < 0.5)
                {
                    vec2 nearestUv =
                        (floor(uv/feedbackTexelSize) + 0.5) *
                            feedbackTexelSize;
                    return texture2D(feedbackTex, nearestUv);
                }

                vec2 texelPosition =
                    uv/feedbackTexelSize - 0.5;
                vec2 base = floor(texelPosition);
                vec2 fraction = fract(texelPosition);
                vec2 topLeft =
                    (base + 0.5)*feedbackTexelSize;
                vec4 top = mix(
                    texture2D(feedbackTex, topLeft),
                    texture2D(
                        feedbackTex,
                        topLeft + vec2(feedbackTexelSize.x, 0.0)
                    ),
                    fraction.x
                );
                vec4 bottom = mix(
                    texture2D(
                        feedbackTex,
                        topLeft + vec2(0.0, feedbackTexelSize.y)
                    ),
                    texture2D(
                        feedbackTex,
                        topLeft + feedbackTexelSize
                    ),
                    fraction.x
                );
                return mix(top, bottom, fraction.y);
            }

            float sampleNearestSurfaceDepth(vec2 uv)
            {
                vec2 baseTexel =
                    floor(uv/projectorVisibilityTexelSize) + 0.5;
                float depth = 0.0;
                for(int y = -1; y <= 1; y++)
                {
                    for(int x = -1; x <= 1; x++)
                    {
                        vec2 sampleUv =
                            (baseTexel + vec2(float(x), float(y))) *
                            projectorVisibilityTexelSize;
                        depth = max(
                            depth,
                            texture2D(
                                projectorVisibilityTex,
                                sampleUv
                            ).x
                        );
                    }
                }
                return depth;
            }

            void main()
            {
                vec4 projectorClip =
                    projectorProjectionMatrix *
                    projectorViewMatrix *
                    vec4(vWorldPos,1.0);

                vec2 uv =
                    projectorClip.xy /
                    max(projectorClip.w, 0.00001) *
                    0.5 +
                    0.5;
                float projectorDepth =
                    projectorClip.z /
                        max(projectorClip.w, 0.00001) *
                    0.5 +
                    0.5;

                if(
                    projectorClip.w <= 0.0 ||
                    uv.x < 0.0 ||
                    uv.x > 1.0 ||
                    uv.y < 0.0 ||
                    uv.y > 1.0
                ){
                    gl_FragColor = vec4(0.015, 0.015, 0.015, 1.0);
                }
                else
                {
                    float nearestSurfaceDepth =
                        sampleNearestSurfaceDepth(uv);
                    if(projectorDepth >
                        nearestSurfaceDepth + 0.00001)
                    {
                        gl_FragColor =
                            vec4(0.015, 0.015, 0.015, 1.0);
                    }
                    else
                    {
                        gl_FragColor = sampleFeedback(uv);
                    }
                }

                #include <colorspace_fragment>
            }
        `
    });
}

function createRandomTexture(seed)
{
    const size = 256;
    const width = Math.round(0.2*size);
    const data = new Uint8Array(width*size*4);
    let state = seed;

    for(let i=0;i<data.length;i+=4)
    {
        state =
            (Math.imul(state,1664525) + 1013904223) >>> 0;
        data[i] = Math.floor((state >>> 24)*0.6);
        data[i+1] = Math.floor(((state >>> 16) & 0xff)*0.6);
        data[i+2] = Math.floor(((state >>> 8) & 0xff)*0.6);
        data[i+3] = 255;
    }

    const texture =
        new THREE.DataTexture(
            data,
            width,
            size,
            THREE.RGBAFormat
        );

    texture.magFilter = THREE.NearestFilter;
    texture.minFilter = THREE.NearestFilter;
    texture.needsUpdate = true;
    return texture;
}

function updateimagePanelTextureCrop(texture)
{
    const textureAspect = getTextureAspect(texture);
    if(!textureAspect)
    {
        return;
    }

    const panelAspect =
        texturedObject.geometry.parameters.width *
        Math.abs(texturedObject.scale.x) /
        (texturedObject.geometry.parameters.height *
            Math.abs(texturedObject.scale.y));
    const repeatX =
        textureAspect > panelAspect
            ? panelAspect/textureAspect
            : 1;
    const repeatY =
        textureAspect < panelAspect
            ? textureAspect/panelAspect
            : 1;

    texture.wrapS = THREE.ClampToEdgeWrapping;
    texture.wrapT = THREE.ClampToEdgeWrapping;
    texture.repeat.set(repeatX, repeatY);
    texture.offset.set(
        (1 - repeatX)*0.5,
        (1 - repeatY)*0.5
    );
    texture.needsUpdate = true;
}

function createPatternTexture(pattern, periodicTile = false)
{
    const canvas = document.createElement("canvas");
    const size = 512;
    canvas.width = size;
    canvas.height = size;
    const context = canvas.getContext("2d");
    const tileRepeats = {
        checker: 8,
        stripes: 8,
        dots: 80
    };

    if(pattern === "checker")
    {
        const cellSize =
            periodicTile ? size/2 : 32;
        for(let y=0;y<size;y+=cellSize)
        {
            for(let x=0;x<size;x+=cellSize)
            {
                context.fillStyle =
                    ((x/cellSize + y/cellSize) % 2 === 0)
                        ? "#f5f5f5"
                        : "#222222";
                context.fillRect(x, y, cellSize, cellSize);
            }
        }
    }
    else if(pattern === "white")
    {
        context.fillStyle = "#ffffff";
        context.fillRect(0, 0, size, size);
    }
    else if(pattern === "stripes")
    {
        context.fillStyle = "#f5f5f5";
        context.fillRect(0, 0, size, size);
        if(periodicTile)
        {
            const imageData =
                context.createImageData(size, size);
            const stripeWidth =
                size*(20/48);
            const stripeColor = [37, 37, 199];

            for(let y=0;y<size;y++)
            {
                for(let x=0;x<size;x++)
                {
                    const phase = ((x - y)%size + size)%size;
                    const distance =
                        Math.min(phase, size - phase);
                    const offset = (y*size + x)*4;
                    const isStripe =
                        distance < stripeWidth*0.5;
                    imageData.data[offset] =
                        isStripe ? stripeColor[0] : 245;
                    imageData.data[offset + 1] =
                        isStripe ? stripeColor[1] : 245;
                    imageData.data[offset + 2] =
                        isStripe ? stripeColor[2] : 245;
                    imageData.data[offset + 3] = 255;
                }
            }
            context.putImageData(imageData, 0, 0);
        }
        else
        {
            context.fillStyle = "#2525c7";
            for(let x=-size;x<size*2;x+=48)
            {
                context.save();
                context.translate(x, 0);
                context.rotate(-Math.PI/4);
                context.fillRect(0, -size, 20, size*3);
                context.restore();
            }
        }
    }
    else if(pattern === "dots")
    {
        const spacing = periodicTile ? size : 6.4;
        const radius = periodicTile ? size*(0.8/6.4) : 0.8;
        context.fillStyle = "#f5f5f5";
        context.fillRect(0, 0, size, size);
        context.fillStyle = "#222222";
        if(periodicTile)
        {
            context.beginPath();
            context.arc(size/2, size/2, radius, 0, Math.PI*2);
            context.fill();
        }
        else
        {
            for(let y=spacing/2;y<size;y+=spacing)
            {
                for(let x=spacing/2;x<size;x+=spacing)
                {
                    context.beginPath();
                    context.arc(x, y, radius, 0, Math.PI*2);
                    context.fill();
                }
            }
        }
    }
    else
    {
        const gradient =
            context.createLinearGradient(0, 0, size, size);
        gradient.addColorStop(0, "#ff3b30");
        gradient.addColorStop(0.5, "#34c759");
        gradient.addColorStop(1, "#007aff");
        context.fillStyle = gradient;
        context.fillRect(0, 0, size, size);
    }

    const texture = new THREE.CanvasTexture(canvas);
    texture.colorSpace = THREE.SRGBColorSpace;
    texture.wrapS = THREE.RepeatWrapping;
    texture.wrapT = THREE.RepeatWrapping;
    if(periodicTile && tileRepeats[pattern])
    {
        texture.userData.projectorTileRepeats =
            tileRepeats[pattern];
    }
    return texture;
}

async function selectimagePanelTexture()
{
    const selectionVersion = ++textureSelectionVersion;
    stopTextureStream();
    const textureType = leftTextureSelect.value;

    if(textureType === "image")
    {
        textureImageFile.hidden = false;
        textureStatus.textContent =
            "Choose an image file to use as the panel texture.";
        return;
    }
    textureImageFile.hidden = true;

    if(textureType === "camera")
    {
        if(!navigator.mediaDevices?.getUserMedia)
        {
            textureStatus.textContent =
                "Camera access requires HTTPS or localhost and a supported browser.";
            return;
        }

        textureStatus.textContent = "Requesting device camera access...";
        let stream = null;
        try
        {
            stream = await navigator.mediaDevices.getUserMedia({
                video:true,
                audio:false
            });
            if(selectionVersion !== textureSelectionVersion)
            {
                stopTextureStream(stream);
                return;
            }

            leftTextureStream = stream;
            cameraTextureVideo.srcObject = stream;
            await cameraTextureVideo.play();
            if(selectionVersion !== textureSelectionVersion)
            {
                stopTextureStream(stream);
                return;
            }

            const texture =
                new THREE.VideoTexture(cameraTextureVideo);
            texture.colorSpace = THREE.SRGBColorSpace;
            setimagePanelTexture(texture);
            textureStatus.textContent =
                "Using live device camera. Choose another texture to stop it.";
        }
        catch(error)
        {
            if(stream)
            {
                stopTextureStream(stream);
            }
            if(selectionVersion === textureSelectionVersion)
            {
                textureStatus.textContent =
                    `Could not start device camera: ${error.message}`;
            }
        }
        return;
    }

    if(textureType === "random")
    {
        setimagePanelTexture(createRandomTexture(0x13579bdf));
        textureStatus.textContent = "Using random texture.";
        return;
    }

    setimagePanelTexture(createPatternTexture(textureType));
    textureStatus.textContent =
        `Using ${leftTextureSelect.selectedOptions[0].textContent.toLowerCase()} pattern.`;
}

        stopProjectorTextureStream();
        projectorTextureStatus.textContent = `Loading ${file.name}...`;
        const imageUrl = URL.createObjectURL(file);
        new THREE.TextureLoader().load(
            imageUrl,
            texture =>
            {
                URL.revokeObjectURL(imageUrl);
                if(selectionVersion !== projectorTextureSelectionVersion)
                {
                    texture.dispose();
                    return;
                }

                texture.colorSpace = THREE.SRGBColorSpace;
                setProjectorTexture(texture);
                projectorTextureStatus.textContent =
                    `Using ${file.name} as the projector texture.`;
            },
            undefined,
            error =>
            {
                URL.revokeObjectURL(imageUrl);
                if(selectionVersion === projectorTextureSelectionVersion)
                {
                    projectorTextureStatus.textContent =
                        `Could not load ${file.name}: ${error.message || "unsupported image file"}.`;

    selectButton.setAttribute("aria-pressed", "false");
    selectButton.addEventListener(
        "click",
        () => selectEditableObject(object)
    );

    const visibilityLabel = document.createElement("label");
    visibilityLabel.className = "sceneObjectVisibility";
    visibilityLabel.title = `Show ${name}`;
    const visibilityCheckbox = document.createElement("input");
    visibilityCheckbox.type = "checkbox";
    visibilityCheckbox.checked = object.visible;
    visibilityCheckbox.setAttribute("aria-label", `Show ${name}`);
    visibilityCheckbox.addEventListener(
        "change",
        () =>
        {
            object.visible = visibilityCheckbox.checked;
            if(selectedObject === object)
            {
                if(transformEditingEnabled && object.visible)
                {
                    transformControls.attach(object);
                }
                else
                {
                    transformControls.detach();
                }
                updateTransformModeButtons();
            }
        }
    );
    visibilityLabel.appendChild(visibilityCheckbox);
    row.append(selectButton, visibilityLabel);
    sceneObjectsList.appendChild(row);
    editableObjectRows.set(object.uuid, row);
}

function updateTransformFields(object)
{
    if(!object)
    {
        document
            .querySelectorAll("[data-transform]")
            .forEach(input => input.value = "");
        return;
    }

    const transforms = {
        position: object.position,
        rotation: {
            x: THREE.MathUtils.radToDeg(object.rotation.x),
            y: THREE.MathUtils.radToDeg(object.rotation.y),
            z: THREE.MathUtils.radToDeg(object.rotation.z)
        },
        scale: object.scale
    };

    document
        .querySelectorAll("[data-transform]")
        .forEach(input =>
        {
            const value =
                transforms[input.dataset.transform][input.dataset.axis];
            input.value = value.toFixed(2);
        });
}

function selectEditableObject(object)
{
    selectedObject = object;
    editableObjectRows.forEach(
        (row, uuid) =>
        {
            const isSelected = object?.uuid === uuid;
            row.dataset.selected = String(isSelected);
            row.querySelector(".sceneObjectSelect")
                .setAttribute(
                    "aria-pressed",
                    String(isSelected)
                );
        }
    );
    const isimagePanel = object === texturedObject;
    imagePanelEditor.hidden = !isimagePanel;
    // document.getElementById("transformPositionRow").hidden = isimagePanel;

    if(object)
    {
        if(transformEditingEnabled && object.visible)
        {
            transformControls.attach(object);
        }
        else
        {
            transformControls.detach();
        }
    }
    else
    {
        transformControls.detach();
    }
    updateTransformModeButtons();
    updateTransformFields(object);
    if(isimagePanel)
    {
        updateimagePanelEditorFields();
    }
}

);

document
    .querySelectorAll("[data-transform]")
    .forEach(input =>
    {
        input.addEventListener(
            "change",
            () =>
            {
                if(!selectedObject || input.value === "")
                {
                    return;
                }

                const value = Number(input.value);
                if(!Number.isFinite(value))
                {
                    updateTransformFields(selectedObject);
                    return;
                }

                const {transform, axis} = input.dataset;
                if(transform === "rotation")
                {
                    selectedObject.rotation[axis] =
                        THREE.MathUtils.degToRad(value);
                }
                else if(transform === "scale")
                {
                    selectedObject.scale[axis] = Math.max(0.01, value);
                }
                else
                {
                    selectedObject.position[axis] = value;
                    if(selectedObject === texturedObject)
                    {
                        selectedObject.userData.manuallyPositioned = true;
                    }
                }
                selectedObject.updateMatrixWorld();
                updateTransformFields(selectedObject);
                if(selectedObject === texturedObject)
                {
                    updateimagePanelEditorFields();
                    if(transform === "scale")
                    {
                        updateimagePanelTextureCrop(
                            selectedObject.material.map
                        );
                    }
                }
            }
        );
    });

document

    .addEventListener(
        "click",
        () =>
        {
            const type =
                document.getElementById("newObjectType").value;
            let geometry;
            let object;
            let name;
            let materialSide = THREE.FrontSide;

            if(type === "head")
            {
                object = createPotatoHead(1);
                name = "Head";
            }
            else if(type === "sphere")
            {
                geometry = new THREE.SphereGeometry(1, 32, 24);
                name = "Sphere";
            }
            else if(type === "plane")
            {
                geometry = new THREE.PlaneGeometry(1, 1);
                name = "Plane";
                materialSide = THREE.DoubleSide;
            }
            else if(type === "cylinder")
            {
                geometry = new THREE.CylinderGeometry(1, 1, 1, 32);
                name = "Cylinder";
            }
            else
            {
                geometry = new THREE.BoxGeometry(1, 1, 1);
                name = "Box";
            }

            if(!object)
            {
                object =
                    new THREE.Mesh(
                        geometry,
                        createFeedbackMaterial(materialSide)
                    );
                registerProjectorObject(object);
            }
            object.position.set(0, 0, 25);
            name = `${name} ${nextObjectNumber++}`;
            scene.add(object);
            registerEditableObject(object, name);
            selectEditableObject(object);
        }
    );

document
    .getElementById("deleteObject")
    .addEventListener(
        "click",
        () =>
        {
            if(!selectedObject)
            {
                editorHint.textContent = "Select an object before deleting it.";
                return;
            }

            const object = selectedObject;
            object.removeFromParent();
            object.traverse(
                child =>
                {
                    if(!child.isMesh)
                    {
                        return;
                    }

                    child.geometry.dispose();
                    if(projectorObjects.delete(child))
                    {
                        child.userData.projectorOnMaterial.dispose();
                        child.userData.projectorOffMaterial.dispose();
                    }
                    else
                    {
                        child.material.dispose();
                    }
                }
            );
            editableObjects.delete(object.uuid);
            editableObjectRows.get(object.uuid)?.remove();
            editableObjectRows.delete(object.uuid);
            selectEditableObject(null);
        }
    );

renderer.domElement.addEventListener(
    "pointerdown",
    event =>
    {
        if(event.button !== 0 ||
            event.target !== renderer.domElement ||
            event.clientX > window.innerWidth - 300)
        {
            pointerDownPosition = null;
            return;
        }
        pointerDownPosition = {
            x: event.clientX,
            y: event.clientY,
            pointerId: event.pointerId
        };
    }
);

    "contextmenu",
    () => pointerDownPosition = null
);

const editorRaycaster = new THREE.Raycaster();
const editorPointer = new THREE.Vector2();
renderer.domElement.addEventListener(
    "pointerup",
    event =>
    {
        if(event.button !== 0 ||
            !pointerDownPosition ||
            event.pointerId !== pointerDownPosition.pointerId ||
            transformControls.dragging ||
            Math.hypot(
                event.clientX - pointerDownPosition.x,
                event.clientY - pointerDownPosition.y
            ) > 5)
        {
            pointerDownPosition = null;
            return;
        }
        pointerDownPosition = null;

        const bounds =
            renderer.domElement.getBoundingClientRect();
        editorPointer.set(
            (event.clientX - bounds.left)/bounds.width*2 - 1,
            -((event.clientY - bounds.top)/bounds.height)*2 + 1
        );
        editorRaycaster.setFromCamera(editorPointer, observerCamera);
        const hits =
            editorRaycaster.intersectObjects(
                [...editableObjects.values()],
                true
            );
        const hit =
            hits.find(intersection => intersection.object !== plane) ||
            hits[0];
        let object = hit?.object || null;
        while(object && !editableObjects.has(object.uuid))
        {
            object = object.parent;
        }
        selectEditableObject(object);
    }
);

renderer.domElement.addEventListener(
    "pointercancel",
    () => pointerDownPosition = null
);

function createCameraLabel(text, color)
{
    const canvas =
        document.createElement("canvas");
    const context =
        canvas.getContext("2d");

    canvas.width = 512;
    canvas.height = 128;
    context.fillStyle = "rgba(0, 0, 0, 0.75)";
    context.fillRect(0, 0, canvas.width, canvas.height);
    context.font = "bold 48px sans-serif";
    context.textAlign = "center";
    context.textBaseline = "middle";
    context.fillStyle = color;
    context.fillText(text, canvas.width/2, canvas.height/2);

    const texture = new THREE.CanvasTexture(canvas);
    const label = new THREE.Sprite(
        new THREE.SpriteMaterial({
            map: texture,
            transparent: true,
            depthTest: false,
            depthWrite: false
        })
    );

    label.scale.set(1.6, 0.4, 1);
    label.layers.set(2);
    return label;
}

///////////////////////////////////////////////////////////////////////////
// animation
///////////////////////////////////////////////////////////////////////////

function animate(timestamp)
{
    requestAnimationFrame(animate);

    if(observerCameraMove)
    {
        if(observerCameraMove.startTime === null)
        {
            observerCameraMove.startTime = timestamp;
        }

        const progress = Math.min(
            1,
            (timestamp - observerCameraMove.startTime)/1000
        );
        const easedProgress =
            progress*progress*(3 - 2*progress);
        observerCamera.position.lerpVectors(
            observerCameraMove.startPosition,
            observerCameraMove.destinationPosition,
            easedProgress
        );
        // controls.target.lerpVectors(
        //     observerCameraMove.startTarget,
        //     observerCameraMove.destinationTarget,
        //     easedProgress
        // );

        if(progress === 1)
        {
            controls.enabled = observerCameraMove.controlsEnabled;
            observerCameraMove = null;
        }
    }

    // if(resetFeedbackRequested)
    // {
    //     previousCameraTexture = seedTexture;
    //     uniforms.feedbackTex.value = seedTexture;
    //     resetFeedbackRequested = false;
    // }

    const source = projectorSourceSelect.value;
    const feedbackFrameDelay =
        1000/Number(frameRateSlider.value);
    const shouldProject =
        source === "pattern" ||
        (source === "photo" && photoReady) ||
        source === "video";
    const shouldProjectThisFrame =
        source !== "video" ||
        lastFeedbackFrameTime === null ||
        timestamp - lastFeedbackFrameTime >= feedbackFrameDelay;

    if(projectorOn && shouldProject && shouldProjectThisFrame)
    {
        lastFeedbackFrameTime = timestamp;

        const usePanelTexture = source === "pattern";
        if(usePanelTexture)
        {
            const sourceTexture = projectorTexture;
            projectionUniforms.currentFrame.value =
                sourceTexture;
            const targetAspect =
                projectedTarget.width/projectedTarget.height;
            const sourceAspect =
                getTextureAspect(sourceTexture) || targetAspect;
            const scaleX =
                targetAspect < sourceAspect
                    ? targetAspect/sourceAspect
                    : 1;
            const scaleY =
                targetAspect > sourceAspect
                    ? sourceAspect/targetAspect
                    : 1;
            const tileRepeats =
                sourceTexture.userData.projectorTileRepeats || 1;
            projectionTextureTransform.set(
                scaleX*tileRepeats,
                0,
                (1 - scaleX*tileRepeats)*0.5,
                0,
                scaleY*tileRepeats,
                (1 - scaleY*tileRepeats)*0.5,
                0, 0, 1
            );
            projectionUniforms.currentFrameTransform.value.copy(
                projectionTextureTransform
            );
            projectionUniforms.textureMode.value = 1;
        }
        else
        {
            projectionUniforms.previousFrame.value =
                olderCameraTexture;
            projectionUniforms.currentFrame.value =
                previousCameraTexture;
            projectionUniforms.currentFrameTransform.value.identity();
            projectionUniforms.textureMode.value = 0;
        }

        renderProjectorVisibility();
        updateCameraKeystoneTransform();
        renderer.setRenderTarget(projectedTarget);
        renderer.clear();
        renderer.render(
            projectionScene,
            projectionCamera
        );

        uniforms.feedbackTex.value =
            projectedTarget.texture;

        if(source === "video")
        {
            captureNextCameraFrame();
        }
    }

    if(photoRequested && source === "photo")
    {
        photoRequested = false;
        takePhotoButton.disabled = false;
        captureNextCameraFrame();
        photoReady = true;
    }

    renderer.setRenderTarget(null);
    renderer.setViewport(
        0,
        0,
        window.innerWidth,
        window.innerHeight
    );

    transformControls.camera = observerCamera;
    renderer.render(scene, observerCamera);

    renderer.autoClear = false;
    renderer.clearDepth();
    renderer.render(transformControlsScene, observerCamera);
    renderer.autoClear = true;

    controls.update();
}

animate();

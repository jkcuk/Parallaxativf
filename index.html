<style>
body{

<script type="module">

import * as THREE from "three";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";
import {TransformControls} from "three/addons/controls/TransformControls.js";

///////////////////////////////////////////////////////////////////////////
// renderer
///////////////////////////////////////////////////////////////////////////

const renderer = new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

document.body.appendChild(renderer.domElement);

///////////////////////////////////////////////////////////////////////////
// scene
///////////////////////////////////////////////////////////////////////////

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101010);

///////////////////////////////////////////////////////////////////////////
// observer camera
///////////////////////////////////////////////////////////////////////////

const observerCamera =
    new THREE.PerspectiveCamera(
        50,
        window.innerWidth/window.innerHeight,
        0.1,
        100
    );

observerCamera.position.set(6,4,-10);
observerCamera.lookAt(0,0,15);

const controls =
    new OrbitControls(
        observerCamera,
        renderer.domElement
    );

controls.target.set(0,0,15);
controls.update();

const transformControls =
    new TransformControls(
        observerCamera,
        renderer.domElement
    );
function setObjectLayer(object, layer)
{
    object.layers?.set(layer);
    object.children?.forEach(
        child => setObjectLayer(child, layer)
    );
}

setObjectLayer(transformControls, 1);
scene.add(transformControls);

transformControls.addEventListener(
    "dragging-changed",
    event =>
    {
        controls.enabled = !event.value;
    }
);

///////////////////////////////////////////////////////////////////////////
// capture camera
///////////////////////////////////////////////////////////////////////////

const captureCamera =
    new THREE.PerspectiveCamera(
        50,
        window.innerWidth/window.innerHeight,
        0.1,
        100
    );

captureCamera.position.set(0.5,0,0);

const captureDisplayCamera =
    new THREE.PerspectiveCamera(
        captureCamera.fov,
        window.innerWidth/window.innerHeight,
        captureCamera.near,
        captureCamera.far
    );

const observerPreviewCamera =
    new THREE.PerspectiveCamera(
        observerCamera.fov,
        1,
        observerCamera.near,
        observerCamera.far
    );

///////////////////////////////////////////////////////////////////////////
// projector
///////////////////////////////////////////////////////////////////////////

const projector =
    new THREE.PerspectiveCamera(
        50,
        window.innerWidth/window.innerHeight,
        0.1,
        100
    );

projector.position.set(-0.5,0,0);

///////////////////////////////////////////////////////////////////////////
// reference plane A
///////////////////////////////////////////////////////////////////////////

const zA = 20;

///////////////////////////////////////////////////////////////////////////
// feedback buffers
///////////////////////////////////////////////////////////////////////////

const SIZE = 1024;

function getFeedbackTargetSize()
{
    const aspect =
        window.innerWidth/window.innerHeight;
    const scale =
        Math.min(1, 1/aspect);
    const height =
        Math.max(1, Math.round(SIZE*scale));
    const width =
        Math.max(1, Math.round(height*aspect));

    return {width, height};
}

const feedbackTargetSize =
    getFeedbackTargetSize();

let previousCameraTarget =
    new THREE.WebGLRenderTarget(
        feedbackTargetSize.width,
        feedbackTargetSize.height
    );

let currentCameraTarget =
    new THREE.WebGLRenderTarget(
        feedbackTargetSize.width,
        feedbackTargetSize.height
    );

const projectedTarget =
    new THREE.WebGLRenderTarget(
        feedbackTargetSize.width,
        feedbackTargetSize.height
    );

///////////////////////////////////////////////////////////////////////////
// seed texture
///////////////////////////////////////////////////////////////////////////

const seedData = new Uint8Array(SIZE*SIZE*4);
const seedCells = new Uint8Array(64*64);
let randomState = 0x12345678;

for(let i=0;i<seedCells.length;i++)
{
    randomState =
        (Math.imul(randomState,1664525) + 1013904223) >>> 0;
    seedCells[i] =
        48 + (randomState >>> 24) * 207 / 255;
}

for(let y=0;y<SIZE;y++)
{
    for(let x=0;x<SIZE;x++)
    {
        const value =
            seedCells[(y >> 4)*64 + (x >> 4)];
        const i =
            (y*SIZE + x)*4;

        seedData[i] = value;
        seedData[i+1] = value;
        seedData[i+2] = value;
        seedData[i+3] = 255;
    }
}

const seedTexture =
    new THREE.DataTexture(
        seedData,
        SIZE,
        SIZE,
        THREE.RGBAFormat
    );

seedTexture.magFilter = THREE.LinearFilter;
seedTexture.minFilter = THREE.LinearFilter;
seedTexture.needsUpdate = true;

let previousCameraTexture = seedTexture;

///////////////////////////////////////////////////////////////////////////
// additive feedback projection
///////////////////////////////////////////////////////////////////////////

const projectionUniforms = {
    previousFrame: {
        value: seedTexture
    },
    currentFrame: {
        value: seedTexture
    },
    previousFactor: {
        value: 0.5
    },
    currentFactor: {
        value: 1
    }
};

const projectionMaterial =
    new THREE.ShaderMaterial({
        uniforms: projectionUniforms,
        vertexShader:`
            varying vec2 vUv;

            void main()
            {
                vUv = uv;
                gl_Position = vec4(position, 1.0);
            }
        `,
        fragmentShader:`
            uniform sampler2D previousFrame;
            uniform sampler2D currentFrame;
            uniform float previousFactor;
            uniform float currentFactor;

            varying vec2 vUv;

            void main()
            {
                vec3 previous =
                    texture2D(previousFrame, vUv).rgb;
                vec3 current =
                    texture2D(currentFrame, vUv).rgb;

                gl_FragColor = vec4(
                    previousFactor * previous +
                    currentFactor * current,
                    1.0
                );
            }
        `
    });

const projectionScene = new THREE.Scene();
projectionScene.add(
    new THREE.Mesh(
        new THREE.PlaneGeometry(2, 2),
        projectionMaterial
    )
);

const projectionCamera =
    new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

///////////////////////////////////////////////////////////////////////////
// shader
///////////////////////////////////////////////////////////////////////////

const uniforms = {

    feedbackTex :
    {
        value : seedTexture
    },

    projectorViewMatrix :
    {
        value : new THREE.Matrix4()
    },

    projectorProjectionMatrix :
    {
        value : projector.projectionMatrix
    },

};

function createFeedbackMaterial(side = THREE.FrontSide)
{
    return new THREE.ShaderMaterial({

        uniforms,
        side,

        vertexShader:`

            varying vec3 vWorldPos;

            void main()
            {
                vec4 wp =
                    modelMatrix *
                    vec4(position,1.0);

                vWorldPos = wp.xyz;

                gl_Position =
                    projectionMatrix *
                    modelViewMatrix *
                    vec4(position,1.0);
            }
        `,

        fragmentShader:`

            uniform sampler2D feedbackTex;
            uniform mat4 projectorViewMatrix;
            uniform mat4 projectorProjectionMatrix;

            varying vec3 vWorldPos;

            void main()
            {
                vec4 projectorClip =
                    projectorProjectionMatrix *
                    projectorViewMatrix *
                    vec4(vWorldPos,1.0);

                vec2 uv =
                    projectorClip.xy /
                    max(projectorClip.w, 0.00001) *
                    0.5 +
                    0.5;

                if(
                    projectorClip.w <= 0.0 ||
                    uv.x < 0.0 ||
                    uv.x > 1.0 ||
                    uv.y < 0.0 ||
                    uv.y > 1.0
                ){
                    gl_FragColor = vec4(0.015, 0.015, 0.015, 1.0);
                } else {
                    gl_FragColor = texture2D(feedbackTex, uv);
                }
            }
        `
    });
}

///////////////////////////////////////////////////////////////////////////
// scene geometry
///////////////////////////////////////////////////////////////////////////

const box =
    new THREE.Mesh(
        new THREE.BoxGeometry(5,5,5),
        createFeedbackMaterial()
    );

box.position.set(-3,-5,20);
box.rotation.set(0.3,0.5,0.2);

scene.add(box);

const sphere =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            5,
            64,
            64
        ),
        createFeedbackMaterial()
    );

sphere.position.set(
        2,
        2,
        22
    );

scene.add(sphere);

const planeA =
    new THREE.Mesh(
        new THREE.PlaneGeometry(24,24),
        createFeedbackMaterial(THREE.DoubleSide)
    );

planeA.position.z = zA;

scene.add(planeA);

function createRandomTexture(seed)
{
    const size = 256;
    const data = new Uint8Array(0.2*size*size*4);
    let state = seed;

    for(let i=0;i<data.length;i+=4)
    {
        state =
            (Math.imul(state,1664525) + 1013904223) >>> 0;
        data[i] = state >>> 24;
        data[i+1] = (state >>> 16) & 0xff;
        data[i+2] = (state >>> 8) & 0xff;
        data[i+3] = 255;
    }

    const texture =
        new THREE.DataTexture(
            data,
            0.2*size,
            size,
            THREE.RGBAFormat
        );

    texture.magFilter = THREE.NearestFilter;
    texture.minFilter = THREE.NearestFilter;
    texture.needsUpdate = true;
    return texture;
}

const objectTextureMaterial =
    seed => new THREE.MeshBasicMaterial({
        map:createRandomTexture(seed),
        side:THREE.DoubleSide
    });

const panelHeight =
    2 * zA * Math.tan(
        THREE.MathUtils.degToRad(captureCamera.fov * 0.5)
    );
const panelWidth = panelHeight * captureCamera.aspect * 0.5;

const leftTexturedObject =
    new THREE.Mesh(
        new THREE.PlaneGeometry(0.3*panelWidth,panelHeight),
        objectTextureMaterial(0x13579bdf)
    );

leftTexturedObject.position.set(
    -panelWidth*0.5,
    0,
    zA-0.01
);
scene.add(leftTexturedObject);

///////////////////////////////////////////////////////////////////////////
// scene editor
///////////////////////////////////////////////////////////////////////////

const editableObjects = new Map();
const sceneObjectsSelect =
    document.getElementById("sceneObjects");
const editorHint =
    document.getElementById("editorHint");
let selectedObject = null;
let nextObjectNumber = 1;

function registerEditableObject(object, name)
{
    object.userData.editorName = name;
    editableObjects.set(object.uuid, object);

    const option =
        document.createElement("option");
    option.value = object.uuid;
    option.textContent = name;
    sceneObjectsSelect.appendChild(option);
}

function updateTransformFields(object)
{
    if(!object)
    {
        document
            .querySelectorAll("[data-transform]")
            .forEach(input => input.value = "");
        return;
    }

    const transforms = {
        position: object.position,
        rotation: {
            x: THREE.MathUtils.radToDeg(object.rotation.x),
            y: THREE.MathUtils.radToDeg(object.rotation.y),
            z: THREE.MathUtils.radToDeg(object.rotation.z)
        },
        scale: object.scale
    };

    document
        .querySelectorAll("[data-transform]")
        .forEach(input =>
        {
            const value =
                transforms[input.dataset.transform][input.dataset.axis];
            input.value = value.toFixed(2);
        });
}

function selectEditableObject(object)
{
    selectedObject = object;
    if(object)
    {
        transformControls.attach(object);
        sceneObjectsSelect.value = object.uuid;
        editorHint.textContent =
            `${object.userData.editorName} selected. Drag the gizmo or edit the values.`;
    }
    else
    {
        transformControls.detach();
        sceneObjectsSelect.selectedIndex = -1;
        editorHint.textContent = "Select an object to edit it.";
    }
    updateTransformFields(object);
}

[box, sphere, planeA, leftTexturedObject].forEach(
    (object, index) =>
    {
        const name = [
            "Box",
            "Sphere",
            "Reference plane",
            "Image panel"
        ][index];
        registerEditableObject(object, name);
    }
);
sceneObjectsSelect.selectedIndex = -1;

sceneObjectsSelect.addEventListener(
    "change",
    () =>
    {
        selectEditableObject(
            editableObjects.get(sceneObjectsSelect.value) || null
        );
    }
);

document
    .querySelectorAll("[data-transform-mode]")
    .forEach(button =>
    {
        button.addEventListener(
            "click",
            () => transformControls.setMode(button.dataset.transformMode)
        );
    });

transformControls.addEventListener(
    "objectChange",
    () =>
    {
        if(selectedObject === leftTexturedObject)
        {
            selectedObject.userData.manuallyPositioned = true;
        }
        updateTransformFields(selectedObject);
    }
);

document
    .querySelectorAll("[data-transform]")
    .forEach(input =>
    {
        input.addEventListener(
            "change",
            () =>
            {
                if(!selectedObject || input.value === "")
                {
                    return;
                }

                const value = Number(input.value);
                if(!Number.isFinite(value))
                {
                    updateTransformFields(selectedObject);
                    return;
                }

                const {transform, axis} = input.dataset;
                if(transform === "rotation")
                {
                    selectedObject.rotation[axis] =
                        THREE.MathUtils.degToRad(value);
                }
                else if(transform === "scale")
                {
                    selectedObject.scale[axis] = Math.max(0.01, value);
                }
                else
                {
                    selectedObject.position[axis] = value;
                    if(selectedObject === leftTexturedObject)
                    {
                        selectedObject.userData.manuallyPositioned = true;
                    }
                }
                selectedObject.updateMatrixWorld();
                updateTransformFields(selectedObject);
            }
        );
    });

document
    .getElementById("addObject")
    .addEventListener(
        "click",
        () =>
        {
            const type =
                document.getElementById("newObjectType").value;
            let geometry;
            let name;
            let materialSide = THREE.FrontSide;

            if(type === "sphere")
            {
                geometry = new THREE.SphereGeometry(1, 32, 24);
                name = "Sphere";
            }
            else if(type === "plane")
            {
                geometry = new THREE.PlaneGeometry(4, 4);
                name = "Plane";
                materialSide = THREE.DoubleSide;
            }
            else if(type === "cylinder")
            {
                geometry = new THREE.CylinderGeometry(1, 1, 2, 32);
                name = "Cylinder";
            }
            else
            {
                geometry = new THREE.BoxGeometry(2, 2, 2);
                name = "Box";
            }

            const object =
                new THREE.Mesh(
                    geometry,
                    createFeedbackMaterial(materialSide)
                );
            object.position.set(0, 0, zA);
            name = `${name} ${nextObjectNumber++}`;
            scene.add(object);
            registerEditableObject(object, name);
            selectEditableObject(object);
        }
    );

document
    .getElementById("deleteObject")
    .addEventListener(
        "click",
        () =>
        {
            if(!selectedObject)
            {
                editorHint.textContent = "Select an object before deleting it.";
                return;
            }

            const object = selectedObject;
            const option =
                [...sceneObjectsSelect.options]
                    .find(item => item.value === object.uuid);
            object.removeFromParent();
            object.geometry.dispose();
            object.material.dispose();
            editableObjects.delete(object.uuid);
            option?.remove();
            selectEditableObject(null);
        }
    );

let pointerDownPosition = null;
renderer.domElement.addEventListener(
    "pointerdown",
    event =>
    {
        if(event.button !== 0 ||
            event.target !== renderer.domElement ||
            event.clientX > window.innerWidth - 300)
        {
            pointerDownPosition = null;
            return;
        }
        pointerDownPosition = {
            x: event.clientX,
            y: event.clientY
        };
    }
);

const editorRaycaster = new THREE.Raycaster();
const editorPointer = new THREE.Vector2();
renderer.domElement.addEventListener(
    "pointerup",
    event =>
    {
        if(!pointerDownPosition ||
            transformControls.dragging ||
            Math.hypot(
                event.clientX - pointerDownPosition.x,
                event.clientY - pointerDownPosition.y
            ) > 5)
        {
            pointerDownPosition = null;
            return;
        }
        pointerDownPosition = null;

        const bounds =
            renderer.domElement.getBoundingClientRect();
        editorPointer.set(
            (event.clientX - bounds.left)/bounds.width*2 - 1,
            -((event.clientY - bounds.top)/bounds.height)*2 + 1
        );
        const viewCamera =
            captureIsMain ? captureDisplayCamera : observerCamera;
        editorRaycaster.setFromCamera(editorPointer, viewCamera);
        const hits =
            editorRaycaster.intersectObjects(
                [...editableObjects.values()],
                false
            );
        const hit =
            hits.find(intersection => intersection.object !== planeA) ||
            hits[0];
        selectEditableObject(hit?.object || null);
    }
);

document.addEventListener(
    "keydown",
    event =>
    {
        if((event.key === "Delete" || event.key === "Backspace") &&
            selectedObject &&
            !["INPUT", "SELECT", "TEXTAREA"].includes(
                document.activeElement.tagName
            ))
        {
            event.preventDefault();
            document.getElementById("deleteObject").click();
        }
    }
);

//         objectTextureMaterial(0x2468ace0)

///////////////////////////////////////////////////////////////////////////
// visualise camera/projector
///////////////////////////////////////////////////////////////////////////

const cameraMarker =
    new THREE.Mesh(
        new THREE.SphereGeometry(0.08,16,16),
        new THREE.MeshBasicMaterial({
            color:0x00ff00
        })
    );

scene.add(cameraMarker);

const projectorMarker =
    new THREE.Mesh(
        new THREE.SphereGeometry(0.08,16,16),
        new THREE.MeshBasicMaterial({
            color:0xff0000
        })
    );

scene.add(projectorMarker);

function createCameraLabel(text, color)
{
    const canvas =
        document.createElement("canvas");
    const context =
        canvas.getContext("2d");

    canvas.width = 512;
    canvas.height = 128;
    context.fillStyle = "rgba(0, 0, 0, 0.75)";
    context.fillRect(0, 0, canvas.width, canvas.height);
    context.font = "bold 48px sans-serif";
    context.textAlign = "center";
    context.textBaseline = "middle";
    context.fillStyle = color;
    context.fillText(text, canvas.width/2, canvas.height/2);

    const texture = new THREE.CanvasTexture(canvas);
    const label = new THREE.Sprite(
        new THREE.SpriteMaterial({
            map: texture,
            transparent: true,
            depthTest: false,
            depthWrite: false
        })
    );

    label.scale.set(1.6, 0.4, 1);
    label.layers.set(1);
    return label;
}

const cameraLabel =
    createCameraLabel("Camera", "#66ff66");
const projectorLabel =
    createCameraLabel("Projector", "#ff6666");

scene.add(cameraLabel, projectorLabel);
observerCamera.layers.enable(1);
observerPreviewCamera.layers.enable(1);

///////////////////////////////////////////////////////////////////////////
// baseline UI
///////////////////////////////////////////////////////////////////////////

const baselineSlider =
    document.getElementById("baseline");

const baselineValue =
    document.getElementById("baselineValue");

const previousFactorSlider =
    document.getElementById("previousFactor");

const previousFactorValue =
    document.getElementById("previousFactorValue");

const currentFactorSlider =
    document.getElementById("currentFactor");

const currentFactorValue =
    document.getElementById("currentFactorValue");

// const resetFeedbackButton =
//     document.getElementById("resetFeedback");

const capturePreview =
    document.getElementById("capturePreview");

const previewLabel =
    document.getElementById("previewLabel");

let captureIsMain = false;

function toggleMainCamera()
{
    captureIsMain = !captureIsMain;
    previewLabel.textContent =
        captureIsMain ? "Observer camera" : "Camera";
    capturePreview.setAttribute(
        "aria-label",
        captureIsMain
            ? "Switch to observer camera view"
            : "Switch to camera view"
    );
}

capturePreview.addEventListener(
    "click",
    toggleMainCamera
);

capturePreview.addEventListener(
    "keydown",
    event =>
    {
        if(event.key === "Enter" || event.key === " ")
        {
            event.preventDefault();
            toggleMainCamera();
        }
    }
);

function updateBaseline()
{
    const b =
        parseFloat(
            baselineSlider.value
        );

    baselineValue.textContent =
        b.toFixed(2);

    captureCamera.position.x =
        +b*0.5;

    captureCamera.lookAt(
        captureCamera.position.x,
        0,
        1
    );

    leftTexturedObject.position.x =
        leftTexturedObject.userData.manuallyPositioned
            ? leftTexturedObject.position.x
            : captureCamera.position.x + panelWidth*0.75;
    // rightTexturedObject.position.x =
    //     captureCamera.position.x - panelWidth*0.85;

    projector.position.x =
        -b*0.5;

    projector.lookAt(
        projector.position.x,
        0,
        1
    );

    cameraMarker.position.copy(
        captureCamera.position
    );

    projectorMarker.position.copy(
        projector.position
    );

    cameraLabel.position.copy(cameraMarker.position);
    cameraLabel.position.y += 0.35;
    projectorLabel.position.copy(projectorMarker.position);
    projectorLabel.position.y += 0.35;

    projector.updateMatrixWorld();
    uniforms.projectorViewMatrix.value.copy(
        projector.matrixWorldInverse
    );
}

function updatePreviousFactor()
{
    const factor =
        parseFloat(previousFactorSlider.value);

    previousFactorValue.textContent =
        factor.toFixed(2);
    projectionUniforms.previousFactor.value =
        factor;
}

function updateCurrentFactor()
{
    const factor =
        parseFloat(currentFactorSlider.value);

    currentFactorValue.textContent =
        factor.toFixed(2);
    projectionUniforms.currentFactor.value =
        factor;
}

baselineSlider.addEventListener(
    "input",
    updateBaseline
);

updateBaseline();

previousFactorSlider.addEventListener(
    "input",
    updatePreviousFactor
);

updatePreviousFactor();

currentFactorSlider.addEventListener(
    "input",
    updateCurrentFactor
);

updateCurrentFactor();

///////////////////////////////////////////////////////////////////////////
// animation
///////////////////////////////////////////////////////////////////////////

function animate()
{
    requestAnimationFrame(animate);

    // if(resetFeedbackRequested)
    // {
    //     previousCameraTexture = seedTexture;
    //     uniforms.feedbackTex.value = seedTexture;
    //     resetFeedbackRequested = false;
    // }

    renderer.setRenderTarget(currentCameraTarget);
    renderer.clear();
    renderer.render(
        scene,
        captureCamera
    );

    projectionUniforms.previousFrame.value =
        previousCameraTexture;
    projectionUniforms.currentFrame.value =
        currentCameraTarget.texture;
    renderer.setRenderTarget(projectedTarget);
    renderer.clear();
    renderer.render(
        projectionScene,
        projectionCamera
    );

    previousCameraTexture =
        currentCameraTarget.texture;
    const spareCameraTarget =
        previousCameraTarget;
    previousCameraTarget =
        currentCameraTarget;
    currentCameraTarget =
        spareCameraTarget;
    uniforms.feedbackTex.value =
        projectedTarget.texture;

    renderer.setRenderTarget(null);
    renderer.setScissorTest(false);
    renderer.setViewport(
        0,
        0,
        window.innerWidth,
        window.innerHeight
    );

    captureDisplayCamera.position.copy(captureCamera.position);
    captureDisplayCamera.quaternion.copy(captureCamera.quaternion);
    captureDisplayCamera.aspect =
        window.innerWidth/window.innerHeight;
    captureDisplayCamera.updateProjectionMatrix();

    const mainCamera =
        captureIsMain ? captureDisplayCamera : observerCamera;
    const previewCamera =
        captureIsMain ? observerPreviewCamera : captureCamera;

    renderer.render(scene, mainCamera);

    const previewBounds =
        capturePreview.getBoundingClientRect();
    const previewX =
        previewBounds.left + 2;
    const previewY =
        window.innerHeight - previewBounds.bottom + 2;
    const previewWidth =
        previewBounds.width - 4;
    const previewHeight =
        previewBounds.height - 4;

    if(captureIsMain)
    {
        observerPreviewCamera.position.copy(observerCamera.position);
        observerPreviewCamera.quaternion.copy(observerCamera.quaternion);
        observerPreviewCamera.aspect =
            previewWidth/previewHeight;
        observerPreviewCamera.updateProjectionMatrix();
    }

    renderer.setScissorTest(true);
    renderer.setViewport(
        previewX,
        previewY,
        previewWidth,
        previewHeight
    );
    renderer.setScissor(
        previewX,
        previewY,
        previewWidth,
        previewHeight
    );
    renderer.render(scene, previewCamera);
    renderer.setScissorTest(false);

    controls.update();
}

animate();

///////////////////////////////////////////////////////////////////////////
// resize
///////////////////////////////////////////////////////////////////////////

window.addEventListener(
    "resize",
    () =>
    {
        const aspect =
            window.innerWidth/window.innerHeight;

        observerCamera.aspect =
            aspect;
        observerCamera.updateProjectionMatrix();

        captureCamera.aspect = aspect;
        captureCamera.updateProjectionMatrix();

        projector.aspect = aspect;
        projector.updateProjectionMatrix();

        const targetSize =
            getFeedbackTargetSize();
        previousCameraTarget.setSize(
            targetSize.width,
            targetSize.height
        );
        currentCameraTarget.setSize(
            targetSize.width,
            targetSize.height
        );
        projectedTarget.setSize(
            targetSize.width,
            targetSize.height
        );

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

</script>
